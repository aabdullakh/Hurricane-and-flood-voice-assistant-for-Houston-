# Run on the server:  sudo docker compose up -d --build   (see docs/DEPLOY.md)
# Requires a .env file (chmod 600). The site names (and so the HTTPS certificates) are in the Caddyfile.
# Only Caddy publishes ports. Docker opens published ports itself (UFW can't block them), so the API and
# database publish none: they're reachable only from Caddy on the internal Docker network.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: orion
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://orion:${POSTGRES_PASSWORD}@db:5432/orion
      # Trust X-Forwarded-For ONLY from Caddy's fixed address below, so per-IP rate limits see the real client.
      FORWARDED_ALLOW_IPS: 172.31.250.10
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    # No "ports:" on purpose. Runs as the non-root "app" user (see api/Dockerfile).
    user: "10001:10001"
    volumes:
      # Dashboard files served live from the server's ~/app/web (read-only), so scripts/deploy.sh can update
      # them without a rebuild or restart. Files there must be world-readable (644) for uid 10001.
      - ./web:/srv/web:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      backend:
        ipv4_address: 172.31.250.10  # the only address the api trusts for X-Forwarded-For
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api

networks:
  backend:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
